<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OIBSIP ATM Portal</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
    body { background: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 24px; width: 100%; max-width: 720px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
    .login-box { max-width: 400px; }
    h1 { font-size: 1.5rem; margin-bottom: 6px; color: #38bdf8; }
    p.sub { font-size: 0.85rem; color: #94a3b8; margin-bottom: 18px; }
    input { width: 100%; padding: 10px 12px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 0.95rem; }
    button { padding: 10px 16px; border: none; border-radius: 8px; background: #0284c7; color: #fff; font-weight: 600; cursor: pointer; transition: 0.2s; }
    button:hover { background: #0369a1; }
    button.danger { background: #dc2626; }
    button.danger:hover { background: #b91c1c; }
    .hidden { display: none; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .balance-box { background: linear-gradient(135deg, #0284c7, #1d4ed8); padding: 18px; border-radius: 12px; margin-bottom: 20px; }
    .balance-box span { font-size: 0.85rem; opacity: 0.9; }
    .balance-box h2 { font-size: 2rem; margin-top: 4px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 20px; }
    .action-card { background: #0f172a; padding: 14px; border-radius: 10px; border: 1px solid #334155; }
    .action-card h3 { font-size: 1rem; margin-bottom: 10px; color: #e2e8f0; }
    .action-card button { width: 100%; }
    .msg { padding: 10px; border-radius: 8px; margin-bottom: 14px; font-size: 0.9rem; display: none; }
    .msg.ok { display: block; background: #064e3b; color: #6ee7b7; border: 1px solid #059669; }
    .msg.err { display: block; background: #7f1d1d; color: #fca5a5; border: 1px solid #dc2626; }
    .history { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 14px; max-height: 200px; overflow-y: auto; }
    .history h3 { font-size: 1rem; margin-bottom: 10px; }
    .tx-row { font-family: monospace; font-size: 0.82rem; padding: 6px 0; border-bottom: 1px solid #1e293b; color: #cbd5e1; }
  </style>
</head>
<body>

  <!-- LOGIN VIEW -->
  <div id="loginView" class="card login-box">
    <h1>OIBSIP ATM Portal</h1>
    <p class="sub">Demo: ID <b>1001</b> / PIN <b>1234</b> &nbsp;|&nbsp; ID <b>1002</b> / PIN <b>5678</b></p>
    <div id="loginMsg" class="msg"></div>
    <input type="text" id="loginId" placeholder="Enter User ID (e.g. 1001)" />
    <input type="password" id="loginPin" placeholder="Enter 4-digit PIN" />
    <button style="width:100%" onclick="login()">Login to ATM</button>
  </div>

  <!-- DASHBOARD VIEW -->
  <div id="dashView" class="card hidden">
    <div class="top-bar">
      <div>
        <h1 id="welcomeText">Welcome</h1>
        <p class="sub" id="userIdText" style="margin:0">User ID: </p>
      </div>
      <button class="danger" onclick="logout()">Logout</button>
    </div>

    <div class="balance-box">
      <span>Available Balance</span>
      <h2 id="balanceText">Rs. 0.00</h2>
    </div>

    <div id="dashMsg" class="msg"></div>

    <div class="grid">
      <div class="action-card">
        <h3>Deposit</h3>
        <input type="number" id="depAmt" placeholder="Amount (Rs.)" />
        <button onclick="doAction('deposit')">Deposit Cash</button>
      </div>
      <div class="action-card">
        <h3>Withdraw</h3>
        <input type="number" id="withAmt" placeholder="Amount (Rs.)" />
        <button onclick="doAction('withdraw')">Withdraw Cash</button>
      </div>
      <div class="action-card">
        <h3>Transfer</h3>
        <input type="text" id="toId" placeholder="Recipient ID (e.g. 1002)" />
        <input type="number" id="transAmt" placeholder="Amount (Rs.)" />
        <button onclick="doAction('transfer')">Send Money</button>
      </div>
    </div>

    <div class="history">
      <h3>Transaction History</h3>
      <div id="txList"></div>
    </div>
  </div>
<script>
    let currentUserId = "";

    function showMsg(elementId, text, isOk) {
      const box = document.getElementById(elementId);
      box.textContent = text;
      box.className = "msg " + (isOk ? "ok" : "err");
    }

    function updateDashboard(data) {
      document.getElementById("welcomeText").textContent = "Welcome, " + data.holderName;
      document.getElementById("userIdText").textContent = "User ID: " + data.userId;
      document.getElementById("balanceText").textContent = "Rs. " + data.balance;

      const txList = document.getElementById("txList");
      txList.innerHTML = "";
      data.history.forEach(item => {
        const div = document.createElement("div");
        div.className = "tx-row";
        div.textContent = item;
        txList.appendChild(div);
      });
    }

    async function login() {
      const userId = document.getElementById("loginId").value.trim();
      const pin = document.getElementById("loginPin").value.trim();

      const body = new URLSearchParams({ userId, pin });
      const res = await fetch("/api/login", { method: "POST", body });
      const data = await res.json();

      if (data.ok) {
        currentUserId = data.userId;
        document.getElementById("loginView").classList.add("hidden");
        document.getElementById("dashView").classList.remove("hidden");
        document.getElementById("loginMsg").className = "msg";
        document.getElementById("dashMsg").className = "msg";
        updateDashboard(data);
      } else {
        showMsg("loginMsg", data.message, false);
      }
    }

    async function doAction(type) {
      const params = new URLSearchParams({ userId: currentUserId });

      if (type === "deposit") {
        params.append("amount", document.getElementById("depAmt").value);
      } else if (type === "withdraw") {
        params.append("amount", document.getElementById("withAmt").value);
      } else if (type === "transfer") {
        params.append("toId", document.getElementById("toId").value.trim());
        params.append("amount", document.getElementById("transAmt").value);
      }

      const res = await fetch("/api/" + type, { method: "POST", body: params });
      const data = await res.json();

      showMsg("dashMsg", data.message, data.ok);
      if (data.ok) {
        updateDashboard(data);
        document.getElementById("depAmt").value = "";
        document.getElementById("withAmt").value = "";
        document.getElementById("toId").value = "";
        document.getElementById("transAmt").value = "";
      }
    }

    function logout() {
      currentUserId = "";
      document.getElementById("loginId").value = "";
      document.getElementById("loginPin").value = "";
      document.getElementById("dashView").classList.add("hidden");
      document.getElementById("loginView").classList.remove("hidden");
    }
  </script>
</body>
</html>
